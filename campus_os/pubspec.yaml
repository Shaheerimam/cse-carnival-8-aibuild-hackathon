name: campus_os
description: "CampusOS — AI-powered university platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  firebase_core: ^4.14.0
  cloud_firestore: ^6.0.3
  firebase_auth: ^6.0.2
  firebase_app_check: ^0.4.7
  firebase_ai: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo/campus-os-appicon-dark.png
  min_sdk_android: 21
